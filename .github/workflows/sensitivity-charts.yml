name: sensitivity-charts
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  charts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pytest==9.2.0
      - run: python -m pytest -q tests/test_sensitivity_charts.py
