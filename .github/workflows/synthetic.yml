name: synthetic-csv
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  synthetic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pytest==9.2.0
      - run: python synthetic/generate.py --check
      - run: python -m pytest -q tests/test_synthetic.py
